apiVersion: apps/v1
kind: Deployment
metadata:
  name: vehicle-registration-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vehicle-registration-system
  template:
    metadata:
      labels:
        app: vehicle-registration-system
    spec:
      containers:
        - name: vehicle-registration-system
          image: your-registry/vehicle-registration-system:v1.0.0
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
